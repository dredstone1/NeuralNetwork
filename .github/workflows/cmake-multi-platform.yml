name: CI

on: [push, pull_request]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libxrandr-dev \
          libxcursor-dev \
          libudev-dev \
          libopenal-dev \
          libflac-dev \
          libvorbis-dev \
          libgl1-mesa-dev \
          libegl1-mesa-dev \
          libxi-dev \
          libfreetype6-dev

    - name: Install CUDA Toolkit
      uses: Jimver/cuda-toolkit@v0.2.26
      with:
        cuda: "12.4.1"
        method: network
        sub-packages: '["nvcc"]'

    - name: Configure CMake
      run: cmake -B build -DBUILD_SHARED_LIBS=TRUE -DCMAKE_CUDA_COMPILER=/usr/local/cuda/bin/nvcc

    - name: Build
      run: cmake --build build --config Release
